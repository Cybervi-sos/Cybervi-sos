<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 760" width="1200" height="760">
<defs>
  <style>
    text { font-family: "Courier New", monospace; }
    .screen { fill:#393939; }
    .pixel { shape-rendering:crispEdges; }
    .option { cursor:pointer; }
    .option .outline { fill:none; stroke:#fff; stroke-width:3; opacity:0; stroke-dasharray:9 5; }
    .option:hover .outline { opacity:1; }
    .option:hover .sprite { filter:drop-shadow(0 0 9px #fff); }
    .option:hover .label { fill:#fff; }
    .label { fill:#d6d6d6; font-size:19px; font-weight:bold; letter-spacing:3px; }
    .hint { fill:#aaa; font-size:12px; letter-spacing:3px; }
    .blink { animation: blink 1.1s steps(2,end) infinite; }
    .float { animation: float 2.8s ease-in-out infinite; }
    .float2 { animation: float 2.8s ease-in-out 1.2s infinite; }
    @keyframes blink { 50% { opacity:.2; } }
    @keyframes float { 50% { transform:translateY(-7px); } }
  </style>
</defs>

<!-- GAME SCREEN -->
<rect width="1200" height="760" fill="#111"/>
<rect x="18" y="18" width="1164" height="724" fill="#393939" stroke="#555" stroke-width="4"/>
<rect x="28" y="28" width="1144" height="704" fill="none" stroke="#242424" stroke-width="2"/>

<!-- PIXEL STARS -->
<g fill="#eee" opacity=".8" class="pixel">
  <rect x="100" y="100" width="5" height="5"/>
  <rect x="210" y="250" width="4" height="4"/>
  <rect x="1080" y="110" width="5" height="5"/>
  <rect x="1000" y="260" width="4" height="4"/>
  <rect x="150" y="610" width="5" height="5"/>
  <rect x="1050" y="600" width="5" height="5"/>
  <rect x="580" y="95" width="4" height="4"/>
  <rect x="640" y="655" width="4" height="4"/>
</g>

<!-- HEADER -->
<g text-anchor="middle">
  <text x="600" y="82" fill="#aaa" font-size="15" letter-spacing="6">WELCOME TO MY UNIVERSE</text>
  <text x="600" y="145" fill="#fff" font-size="48" font-weight="bold" letter-spacing="4">VITORIA COSTA</text>
  <text x="600" y="178" fill="#d2d2d2" font-size="14" letter-spacing="5">SOFTWARE ENGINEERING</text>
  <path d="M390 198H810" stroke="#aaa" stroke-width="2" stroke-dasharray="5 7"/>
</g>

