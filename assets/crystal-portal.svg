<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<defs>
<style>
text{font-family:"Trebuchet MS",Arial,sans-serif}
.pixel{shape-rendering:crispEdges}
.option{cursor:pointer}
.outline{fill:none;stroke:#fff;stroke-width:3;opacity:0;stroke-dasharray:9 5}
.option:hover .outline{opacity:1}
.option:hover .sprite{filter:drop-shadow(0 0 9px #fff)}
.blink{animation:blink 1.1s steps(2,end) infinite}
.float{animation:float 2.8s ease-in-out infinite}
.float2{animation:float 2.8s ease-in-out 1.2s infinite}
.title{font-weight:900;letter-spacing:2px}
@keyframes blink{50%{opacity:.2}}
@keyframes float{50%{transform:translateY(-7px)}}
</style>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#21183f"/><stop offset=".55" stop-color="#65447f"/><stop offset="1" stop-color="#172c4b"/></linearGradient>
<linearGradient id="crystal" x2="1" y2="1"><stop stop-color="#fff8ff"/><stop offset=".4" stop-color="#d8aaff"/><stop offset="1" stop-color="#5fd7e8"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

