    <rect x="60" y="190" width="32" height="7" fill="#25202a"/>
    <rect x="103" y="190" width="32" height="7" fill="#25202a"/>
  </g>
  <text class="label" x="95" y="245" text-anchor="middle">STEVEN</text>
  <text class="hint" x="95" y="265" text-anchor="middle">MY UNIVERSE</text>
</g>
